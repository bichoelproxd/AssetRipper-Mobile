name: Android

on:
  push:
    branches: [master, android]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android workload
        run: dotnet workload install android

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/assetripper.keystore" -alias assetripper \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass assetripper -keypass assetripper \
            -dname "CN=AssetRipper Mobile"

      - name: Build APK
        shell: bash
        run: |
          set +e
          dotnet publish Source/AssetRipper.GUI.Android/AssetRipper.GUI.Android.csproj \
            -c Release -f net10.0-android \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore=$RUNNER_TEMP/assetripper.keystore \
            -p:AndroidSigningKeyAlias=assetripper \
            -p:AndroidSigningKeyPass=assetripper \
            -p:AndroidSigningStorePass=assetripper 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            grep -E "error [A-Za-z]+[0-9]+|: error " build.log | sort -u | head -15 | cut -c1-400 | while read -r l; do echo "::error::$l"; done
          fi
          exit $code

      - name: Collect APK
        run: |
          mkdir -p dist
          find Source/0Bins -name "*-Signed.apk" -exec cp {} dist/AssetRipper-universal.apk \;
          ls -lh dist
          unzip -l dist/AssetRipper-universal.apk | grep -E "lib/(arm64-v8a|armeabi-v7a)/libmonodroid|libcoreclr|libSystem.Native" | head

      - name: Verify APK
        run: |
          APK=dist/AssetRipper-universal.apk
          ABIS=$(unzip -Z1 $APK | grep -oE '^lib/[^/]+/' | sort -u | tr '\n' ' ')
          ASP=$(unzip -Z1 $APK | grep -c 'Microsoft.AspNetCore' || true)
          SIZE=$(du -h $APK | cut -f1)
          echo "::notice::APK $SIZE | ABIs: $ABIS | AspNetCore entries: $ASP"
          echo "$ABIS" | grep -q arm64-v8a
          echo "$ABIS" | grep -q armeabi-v7a

      - uses: actions/upload-artifact@v5
        with:
          name: AssetRipper-Android-apk
          path: dist/*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/android' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/AssetRipper-universal.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "AssetRipper Android (universal APK)" \
            --notes "APK universal (arm64-v8a + armeabi-v7a). Compilado automaticamente desde $GITHUB_SHA."
